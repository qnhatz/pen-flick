<!-- RESUME: Session 3 — add mouse/touch drag input, aim line, dotted trajectory preview, launch on release -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pen Flick</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #c8bfa8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    user-select: none;
    overflow: hidden;
  }

  #game-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #hud {
    display: flex;
    align-items: center;
    gap: 48px;
    font-size: 16px;
    color: #3a3220;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  #hud .label {
    font-size: 13px;
    color: #7a6a50;
    font-weight: normal;
    margin-bottom: 2px;
  }

  #hud .side {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #hud .vs {
    font-size: 13px;
    color: #9a8a70;
    letter-spacing: 2px;
  }

  #status-bar {
    font-size: 14px;
    color: #5a4a30;
    min-height: 20px;
    letter-spacing: 0.3px;
    font-style: italic;
  }

  canvas {
    display: block;
    border: 1px solid #a09070;
    box-shadow:
      3px 3px 0 #b0a080,
      6px 6px 0 #a09070,
      8px 8px 18px rgba(0,0,0,0.35);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="hud">
    <div class="side">
      <div class="label">YOU</div>
      <div id="player-lives">❤️❤️❤️</div>
    </div>
    <div class="vs">VS</div>
    <div class="side">
      <div class="label">CPU</div>
      <div id="cpu-lives">❤️❤️❤️</div>
    </div>
  </div>

  <div id="status-bar">Click and drag your figure to aim</div>

  <canvas id="c"></canvas>
</div>

<script>
// ─── Canvas setup ────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// Fixed logical size; CSS scales on tiny screens if needed
const W = 780;
const H = 440;
canvas.width  = W;
canvas.height = H;

// ─── Layout constants ────────────────────────────────────────────────────────

const GROUND_Y     = H - 90;   // y where figures stand
const LINE_SPACING = 26;       // notebook ruled line gap
const MARGIN_X     = 64;       // red margin line x
const SPIRAL_W     = 28;       // left spiral gutter width

// ─── Colour palette (ink/paper theme) ────────────────────────────────────────

const COL = {
  paper:       '#f8f4ec',
  lineRule:    '#c0cfe8',   // blue ruled lines
  margin:      '#e8a0a0',   // red margin
  spiralDark:  '#888',
  spiralLight: '#ddd',
  ink:         '#2a3baa',   // figure ink colour
  ground:      '#c8b898',
  groundLine:  '#b0a080',
  labelText:   'rgba(42,59,170,0.45)',
};

// ─── Figure definitions ──────────────────────────────────────────────────────

const PLAYER = { x: 160,     y: GROUND_Y };
const CPU    = { x: W - 160, y: GROUND_Y };

// ─── Physics constants ───────────────────────────────────────────────────────

const GRAVITY      = 0.38;   // px / frame²
const BOUNCE_VY    = 0.42;   // vy kept after ground bounce
const BOUNCE_VX    = 0.80;   // vx kept after ground bounce
const SPIN_DECAY   = 0.70;   // spin kept after bounce
const STOP_THRESH  = 0.9;    // vy below this → pen comes to rest

// ─── Pen state ───────────────────────────────────────────────────────────────

// null when not in flight; object when flying or rolling to a stop
let pen = null;

function createPen(x, y, vx, vy) {
  return {
    x, y,
    vx, vy,
    angle: Math.atan2(vy, vx),
    spin:  (vx > 0 ? 1 : -1) * (0.10 + Math.random() * 0.08),
    alive: true,
  };
}

// ─── Pen physics step ────────────────────────────────────────────────────────

function stepPen() {
  if (!pen) return;

  pen.x     += pen.vx;
  pen.y     += pen.vy;
  pen.vy    += GRAVITY;
  pen.angle += pen.spin;

  // Ground bounce
  if (pen.y >= GROUND_Y) {
    pen.y  = GROUND_Y;
    pen.vy = -pen.vy * BOUNCE_VY;
    pen.vx *=  BOUNCE_VX;
    pen.spin *= SPIN_DECAY;

    if (Math.abs(pen.vy) < STOP_THRESH) {
      pen.vy   = 0;
      pen.spin = 0;
      // Let it slide to a stop then clear
      if (Math.abs(pen.vx) < 0.3) {
        pen = null;
        onPenSettled();
        return;
      }
    }
  }

  // Off left/right edge — clear silently
  if (pen.x < -80 || pen.x > W + 80) {
    pen = null;
    onPenSettled();
  }
}

// Called when pen finishes its flight — placeholder for game logic (Session 4)
function onPenSettled() {}

// ─── Pen visual ──────────────────────────────────────────────────────────────

const PEN_LEN  = 62;   // total pen length in px
const PEN_W    = 7;    // barrel diameter

function drawPen() {
  if (!pen) return;

  ctx.save();
  ctx.translate(pen.x, pen.y);
  ctx.rotate(pen.angle);

  const half = PEN_LEN / 2;

  // ── Barrel (clear plastic body) ──────────────────────────────────────────
  ctx.fillStyle   = 'rgba(220,215,200,0.88)';
  ctx.strokeStyle = 'rgba(160,150,130,0.7)';
  ctx.lineWidth   = 0.8;
  // Main barrel: from tip-side to cap-side  (tip at -half, cap at +half)
  roundRect(ctx, -half + 8, -PEN_W / 2, PEN_LEN - 18, PEN_W, 2);
  ctx.fill();
  ctx.stroke();

  // ── Ink tube visible through barrel ──────────────────────────────────────
  ctx.fillStyle = 'rgba(42,59,170,0.5)';
  roundRect(ctx, -half + 10, -1.2, PEN_LEN - 30, 2.4, 1);
  ctx.fill();

  // ── Grip section (rubberised middle third) ────────────────────────────────
  const gripStart = -10;
  const gripLen   = 18;
  ctx.fillStyle   = 'rgba(80,70,60,0.18)';
  roundRect(ctx, gripStart, -PEN_W / 2, gripLen, PEN_W, 2);
  ctx.fill();
  // Grip ridges
  ctx.strokeStyle = 'rgba(80,70,60,0.25)';
  ctx.lineWidth   = 1;
  for (let i = 0; i < 5; i++) {
    const rx = gripStart + 2 + i * 3.2;
    ctx.beginPath();
    ctx.moveTo(rx, -PEN_W / 2 + 1);
    ctx.lineTo(rx,  PEN_W / 2 - 1);
    ctx.stroke();
  }

  // ── Cap (blue, right end) ─────────────────────────────────────────────────
  ctx.fillStyle   = '#2a5fc4';
  ctx.strokeStyle = '#1a3f94';
  ctx.lineWidth   = 0.8;
  roundRect(ctx, half - 14, -PEN_W / 2, 14, PEN_W, 2);
  ctx.fill();
  ctx.stroke();

  // Cap clip
  ctx.fillStyle = '#1a3f94';
  ctx.fillRect(half - 12, -PEN_W / 2 - 2, 3, PEN_W + 4);

  // ── Tip (metallic cone, left end) ─────────────────────────────────────────
  ctx.fillStyle   = '#b0a890';
  ctx.strokeStyle = '#908070';
  ctx.lineWidth   = 0.8;
  ctx.beginPath();
  ctx.moveTo(-half,     0);
  ctx.lineTo(-half + 9, -PEN_W / 2);
  ctx.lineTo(-half + 9,  PEN_W / 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Ball tip dot
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(-half, 0, 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ─── Rounded rect helper ─────────────────────────────────────────────────────

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

// ─── Drag / input state ──────────────────────────────────────────────────────

const DRAG_RADIUS = 55;    // px from figure center that starts a drag
const MAX_PULL    = 110;   // max drag distance (caps power)
const SPEED_SCALE = 0.17;  // drag px → launch speed multiplier

let drag = null;   // null | { startX, startY, curX, curY }

// ─── Canvas coordinate helper ────────────────────────────────────────────────

function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (W / rect.width),
    y: (src.clientY - rect.top)  * (H / rect.height),
  };
}

function nearPlayer(pos) {
  return Math.hypot(pos.x - PLAYER.x, pos.y - (PLAYER.y - 50)) < DRAG_RADIUS;
}

// ─── Launch helper ───────────────────────────────────────────────────────────

function launchFromDrag() {
  const { startX, startY, curX, curY } = drag;
  drag = null;

  const dx   = startX - curX;   // slingshot: opposite of pull direction
  const dy   = startY - curY;
  const dist = Math.hypot(dx, dy);
  if (dist < 8) { setStatus('Drag further to flick!'); return; }

  const clamped = Math.min(dist, MAX_PULL);
  const speed   = clamped * SPEED_SCALE;
  const nx      = dx / dist;
  const ny      = dy / dist;

  pen = createPen(startX, startY, nx * speed, ny * speed);
  setStatus('');
}

// ─── Mouse events ────────────────────────────────────────────────────────────

canvas.addEventListener('mousedown', e => {
  if (pen) return;
  const pos = canvasPos(e);
  if (!nearPlayer(pos)) return;
  drag = { startX: PLAYER.x, startY: PLAYER.y - 50, curX: pos.x, curY: pos.y };
});

canvas.addEventListener('mousemove', e => {
  const pos = canvasPos(e);
  canvas.style.cursor = (!pen && nearPlayer(pos)) ? 'grab' : 'crosshair';
  if (!drag) return;
  drag.curX = pos.x;
  drag.curY = pos.y;
  const dist  = Math.hypot(drag.startX - pos.x, drag.startY - pos.y);
  const power = Math.round(Math.min(dist, MAX_PULL) / MAX_PULL * 100);
  setStatus(`Power: ${power}%`);
});

canvas.addEventListener('mouseup', () => { if (drag) launchFromDrag(); });
canvas.addEventListener('mouseleave', () => { drag = null; setStatus('Click and drag your figure to aim'); });

// ─── Touch events ────────────────────────────────────────────────────────────

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (pen) return;
  const pos = canvasPos(e);
  if (!nearPlayer(pos)) return;
  drag = { startX: PLAYER.x, startY: PLAYER.y - 50, curX: pos.x, curY: pos.y };
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!drag) return;
  const pos = canvasPos(e);
  drag.curX = pos.x;
  drag.curY = pos.y;
  const dist  = Math.hypot(drag.startX - pos.x, drag.startY - pos.y);
  const power = Math.round(Math.min(dist, MAX_PULL) / MAX_PULL * 100);
  setStatus(`Power: ${power}%`);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (drag) launchFromDrag();
});

// ─── Aim overlay ─────────────────────────────────────────────────────────────

function drawAim() {
  if (!drag) return;

  const { startX, startY, curX, curY } = drag;
  const rawDx   = startX - curX;
  const rawDy   = startY - curY;
  const rawDist = Math.hypot(rawDx, rawDy);
  if (rawDist < 4) return;

  const clamped = Math.min(rawDist, MAX_PULL);
  const nx      = rawDx / rawDist;
  const ny      = rawDy / rawDist;
  const pullX   = startX - nx * clamped;   // clamped visual anchor
  const pullY   = startY - ny * clamped;
  const power   = clamped / MAX_PULL;      // 0–1

  ctx.save();

  // ── Rubber-band pull line ─────────────────────────────────────────────────
  ctx.strokeStyle = `rgba(200,60,60,${0.3 + power * 0.45})`;
  ctx.lineWidth   = 1.5 + power;
  ctx.setLineDash([5, 4]);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(pullX, pullY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Pull-point circle
  ctx.fillStyle   = `rgba(200,60,60,${0.15 + power * 0.3})`;
  ctx.strokeStyle = `rgba(200,60,60,${0.55 + power * 0.3})`;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(pullX, pullY, 5 + power * 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // ── Predicted trajectory ─────────────────────────────────────────────────
  const speed = clamped * SPEED_SCALE;
  let px = startX, py = startY;
  let pvx = nx * speed, pvy = ny * speed;

  ctx.strokeStyle = `rgba(42,59,170,${0.15 + power * 0.25})`;
  ctx.lineWidth   = 1.5;
  ctx.setLineDash([3, 8]);
  ctx.beginPath();
  ctx.moveTo(px, py);

  for (let i = 0; i < 60; i++) {
    px  += pvx;
    py  += pvy;
    pvy += GRAVITY;
    if (py > GROUND_Y || px < 0 || px > W) break;
    ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

// ─── Status bar helper ───────────────────────────────────────────────────────

function setStatus(msg) {
  document.getElementById('status-bar').textContent =
    msg || 'Click and drag your figure to aim';
}

// ─── Notebook background ─────────────────────────────────────────────────────

function drawNotebook() {
  // Paper fill
  ctx.fillStyle = COL.paper;
  ctx.fillRect(0, 0, W, H);

  // Spiral gutter shadow
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0, 0, SPIRAL_W, H);

  // Horizontal ruled lines
  ctx.strokeStyle = COL.lineRule;
  ctx.lineWidth   = 0.8;
  for (let y = 48; y < H; y += LINE_SPACING) {
    ctx.beginPath();
    ctx.moveTo(SPIRAL_W, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Red margin line
  ctx.strokeStyle = COL.margin;
  ctx.lineWidth   = 1.4;
  ctx.beginPath();
  ctx.moveTo(MARGIN_X, 0);
  ctx.lineTo(MARGIN_X, H);
  ctx.stroke();

  // Spiral binding rings
  drawSpiral();

  // Ground / desk surface
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, GROUND_Y + 6, W, H - GROUND_Y - 6);

  // Ground edge line
  ctx.strokeStyle = COL.groundLine;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 6);
  ctx.lineTo(W, GROUND_Y + 6);
  ctx.stroke();
}

function drawSpiral() {
  const ringGap = 18;
  const cx      = 14;   // center x of rings
  const ry      = 9;    // ring height
  const rx      = 8;    // ring width

  ctx.lineWidth = 2;

  for (let y = 36; y < H - 20; y += ringGap) {
    // Back arc (lighter, behind paper)
    ctx.strokeStyle = COL.spiralLight;
    ctx.beginPath();
    ctx.ellipse(cx, y, rx, ry, 0, 0, Math.PI);
    ctx.stroke();

    // Front arc (darker, in front)
    ctx.strokeStyle = COL.spiralDark;
    ctx.beginPath();
    ctx.ellipse(cx, y, rx, ry, 0, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
}

// ─── Stick figure ────────────────────────────────────────────────────────────

function drawFigure(fig, opts = {}) {
  const { x, y }   = fig;
  const col         = opts.colour   || COL.ink;
  const headR       = 13;
  const bodyTop     = y - 44;  // shoulders
  const bodyBot     = y - 2;   // hips
  const headCy      = bodyTop - headR - 2;
  const armY        = bodyTop + 10;
  const armSpread   = 22;
  const legSpread   = 16;
  const legLen      = 30;

  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth   = 2.2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  // Head
  ctx.beginPath();
  ctx.arc(x, headCy, headR, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(x, bodyTop);
  ctx.lineTo(x, bodyBot);
  ctx.stroke();

  // Arms — slight raise on dominant side
  ctx.beginPath();
  ctx.moveTo(x - armSpread, armY + 4);
  ctx.lineTo(x,             armY);
  ctx.lineTo(x + armSpread, armY - 6);
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(x, bodyBot);
  ctx.lineTo(x - legSpread, bodyBot + legLen);
  ctx.moveTo(x, bodyBot);
  ctx.lineTo(x + legSpread, bodyBot + legLen);
  ctx.stroke();

  ctx.restore();
}

// ─── Figure labels ───────────────────────────────────────────────────────────

function drawLabels() {
  ctx.fillStyle = COL.labelText;
  ctx.font      = 'bold 11px Courier New';
  ctx.textAlign = 'center';

  ctx.fillText('YOU', PLAYER.x, PLAYER.y + 50);
  ctx.fillText('CPU', CPU.x,    CPU.y    + 50);

  ctx.textAlign = 'left'; // reset
}

// ─── Main render ─────────────────────────────────────────────────────────────

function render() {
  drawNotebook();
  drawFigure(PLAYER);
  drawFigure(CPU);
  drawLabels();
  drawAim();
  drawPen();
}

// ─── Game loop ───────────────────────────────────────────────────────────────

function loop() {
  ctx.clearRect(0, 0, W, H);
  stepPen();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
