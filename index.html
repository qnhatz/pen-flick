<!-- RESUME: Session 5 — hit detection (line-rect intersection), lives system, state machine, win/lose, restart -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pen Flick</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #c8bfa8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    user-select: none;
    overflow: hidden;
  }

  #game-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #hud {
    display: flex;
    align-items: center;
    gap: 48px;
    font-size: 16px;
    color: #3a3220;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  #hud .label {
    font-size: 13px;
    color: #7a6a50;
    font-weight: normal;
    margin-bottom: 2px;
  }

  #hud .side {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #hud .vs {
    font-size: 13px;
    color: #9a8a70;
    letter-spacing: 2px;
  }

  #status-bar {
    font-size: 14px;
    color: #5a4a30;
    min-height: 20px;
    letter-spacing: 0.3px;
    font-style: italic;
  }

  canvas {
    display: block;
    border: 1px solid #a09070;
    box-shadow:
      3px 3px 0 #b0a080,
      6px 6px 0 #a09070,
      8px 8px 18px rgba(0,0,0,0.35);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="hud">
    <div class="side">
      <div class="label">YOU</div>
      <div id="player-lives">❤️❤️❤️</div>
    </div>
    <div class="vs">VS</div>
    <div class="side">
      <div class="label">CPU</div>
      <div id="cpu-lives">❤️❤️❤️</div>
    </div>
  </div>

  <div id="status-bar">Click and drag your figure to aim</div>

  <canvas id="c"></canvas>
</div>

<script>
// ─── Canvas setup ────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// Fixed logical size; CSS scales on tiny screens if needed
const W = 780;
const H = 440;
canvas.width  = W;
canvas.height = H;

// ─── Layout constants ────────────────────────────────────────────────────────

const GROUND_Y     = H - 90;   // y where figures stand
const LINE_SPACING = 26;       // notebook ruled line gap
const MARGIN_X     = 64;       // red margin line x
const SPIRAL_W     = 28;       // left spiral gutter width

// ─── Colour palette (ink/paper theme) ────────────────────────────────────────

const COL = {
  paper:       '#f8f4ec',
  lineRule:    '#c0cfe8',   // blue ruled lines
  margin:      '#e8a0a0',   // red margin
  spiralDark:  '#888',
  spiralLight: '#ddd',
  ink:         '#2a3baa',   // figure ink colour
  ground:      '#c8b898',
  groundLine:  '#b0a080',
  labelText:   'rgba(42,59,170,0.45)',
};

// ─── Figure definitions ──────────────────────────────────────────────────────

const PLAYER = { x: 160,     y: GROUND_Y };
const CPU    = { x: W - 160, y: GROUND_Y };

// hit zone: circle centered on figure torso
const HIT_CY_OFFSET = 38;   // px above foot line → torso centre
const HIT_RADIUS    = 32;   // px radius of hit zone

// ─── Game state ───────────────────────────────────────────────────────────────

// phases: player_aim | player_shooting | cpu_thinking | cpu_shooting | gameover
let gameState   = 'player_aim';
let playerLives = 3;
let cpuLives    = 3;
let hitFlash    = null;   // { who:'player'|'cpu', timer }
let gameOverMsg = '';

function updateHUD() {
  document.getElementById('player-lives').textContent = '❤️'.repeat(playerLives);
  document.getElementById('cpu-lives').textContent    = '❤️'.repeat(cpuLives);
}

function restartGame() {
  playerLives = 3;
  cpuLives    = 3;
  shot        = null;
  marks       = [];
  drag        = null;
  hitFlash    = null;
  gameState   = 'player_aim';
  updateHUD();
  setStatus('');
}

// ─── Shot constants ───────────────────────────────────────────────────────────

const SHOT_MAX_LEN    = Math.hypot(W, H) * 1.1;  // always crosses the canvas
const SHOT_FRAMES_MIN = 10;   // fastest shot (full power)
const SHOT_FRAMES_MAX = 24;   // slowest shot (low power)

// ─── Shot state ───────────────────────────────────────────────────────────────

let shot  = null;   // active shot: { x1,y1, angle, frames, progress, owner }
let marks = [];     // past shots that stay on paper: { x1,y1, x2,y2, owner }

// ─── Hit detection ───────────────────────────────────────────────────────────

// Returns distance along shot ray at which it enters the target hit-circle,
// or Infinity if it misses.
function computeHitDist(x1, y1, angle, target) {
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const cx   = target.x;
  const cy   = target.y - HIT_CY_OFFSET;
  const fx   = x1 - cx;
  const fy   = y1 - cy;
  const b    = fx * cosA + fy * sinA;
  const c    = fx * fx + fy * fy - HIT_RADIUS * HIT_RADIUS;
  const disc = b * b - c;
  if (disc < 0) return Infinity;
  const t = -b - Math.sqrt(disc);
  return t > 0 ? t : Infinity;
}

function createShot(x1, y1, angle, power, owner) {
  const target  = owner === 'player' ? CPU : PLAYER;
  const hitDist = computeHitDist(x1, y1, angle, target);
  const frames  = Math.round(SHOT_FRAMES_MAX - power * (SHOT_FRAMES_MAX - SHOT_FRAMES_MIN));
  return { x1, y1, angle, frames, progress: 0, owner, hitDist };
}

// ─── Shot step ───────────────────────────────────────────────────────────────

function stepShot() {
  if (!shot) return;
  shot.progress += 1 / shot.frames;
  const currentLen = shot.progress * SHOT_MAX_LEN;

  // Hit — freeze line at impact point
  if (currentLen >= shot.hitDist) {
    shot.progress = shot.hitDist / SHOT_MAX_LEN;
    const tip = shotTip(shot);
    marks.push({ x1: shot.x1, y1: shot.y1, x2: tip.x, y2: tip.y, owner: shot.owner });
    const owner = shot.owner;
    shot = null;
    onHit(owner);
    return;
  }

  if (shot.progress >= 1) {
    shot.progress = 1;
    const tip = shotTip(shot);
    marks.push({ x1: shot.x1, y1: shot.y1, x2: tip.x, y2: tip.y, owner: shot.owner });
    shot = null;
    onMiss();
  }
}

function shotTip(s) {
  const t = s.progress * SHOT_MAX_LEN;
  return { x: s.x1 + Math.cos(s.angle) * t, y: s.y1 + Math.sin(s.angle) * t };
}

// ─── Turn outcomes ────────────────────────────────────────────────────────────

function onHit(owner) {
  if (owner === 'player') {
    cpuLives--;
    hitFlash = { who: 'cpu', timer: 35 };
    updateHUD();
    if (cpuLives <= 0) { endGame('You win! 🎉'); return; }
    setStatus('Hit! CPU loses a life.');
    setTimeout(startCpuTurn, 1000);
  } else {
    playerLives--;
    hitFlash = { who: 'player', timer: 35 };
    updateHUD();
    if (playerLives <= 0) { endGame('CPU wins! 😤'); return; }
    setStatus('Ouch! Your turn.');
    gameState = 'player_aim';
  }
}

function onMiss() {
  if (gameState === 'player_shooting') {
    setStatus('Missed! CPU\'s turn...');
    setTimeout(startCpuTurn, 800);
  } else {
    setStatus('CPU missed! Your turn.');
    gameState = 'player_aim';
  }
}

function endGame(msg) {
  gameState   = 'gameover';
  gameOverMsg = msg;
}

// ─── CPU turn ─────────────────────────────────────────────────────────────────

function startCpuTurn() {
  if (gameState === 'gameover') return;
  gameState = 'cpu_thinking';
  setStatus('CPU is aiming…');
  setTimeout(cpuShoot, 500 + Math.random() * 400);
}

function cpuShoot() {
  if (gameState === 'gameover') return;
  const fromX  = CPU.x;
  const fromY  = CPU.y - 50;
  const toX    = PLAYER.x;
  const toY    = PLAYER.y - HIT_CY_OFFSET;
  const base   = Math.atan2(toY - fromY, toX - fromX);
  const spread = (Math.random() - 0.5) * 0.55;   // ±0.27 rad (~15°)
  const power  = 0.45 + Math.random() * 0.55;
  gameState = 'cpu_shooting';
  shot = createShot(fromX, fromY, base + spread, power, 'cpu');
}

// ─── Shot visuals ─────────────────────────────────────────────────────────────

function drawShot() {
  if (!shot) return;
  const tip = shotTip(shot);
  ctx.save();
  ctx.strokeStyle = shot.owner === 'player' ? 'rgba(42,59,170,0.9)' : 'rgba(180,40,40,0.9)';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(shot.x1, shot.y1);
  ctx.lineTo(tip.x, tip.y);
  ctx.stroke();
  ctx.restore();
}

function drawMarks() {
  if (!marks.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (const m of marks) {
    ctx.strokeStyle = m.owner === 'player'
      ? 'rgba(42,59,170,0.28)'
      : 'rgba(180,40,40,0.28)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x1, m.y1);
    ctx.lineTo(m.x2, m.y2);
    ctx.stroke();
  }
  ctx.restore();
}

// ─── Drag / input state ──────────────────────────────────────────────────────

const DRAG_RADIUS = 55;    // px from figure center that starts a drag
const MAX_PULL    = 110;   // max drag distance (caps power)

let drag = null;   // null | { startX, startY, curX, curY }

// ─── Canvas coordinate helper ────────────────────────────────────────────────

function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (W / rect.width),
    y: (src.clientY - rect.top)  * (H / rect.height),
  };
}

function nearPlayer(pos) {
  return Math.hypot(pos.x - PLAYER.x, pos.y - (PLAYER.y - 50)) < DRAG_RADIUS;
}

// ─── Launch helper ───────────────────────────────────────────────────────────

function launchFromDrag() {
  const { startX, startY, curX, curY } = drag;
  drag = null;

  const dx   = startX - curX;   // slingshot: opposite of pull direction
  const dy   = startY - curY;
  const dist = Math.hypot(dx, dy);
  if (dist < 8) { setStatus('Drag further to flick!'); return; }

  const power = Math.min(dist, MAX_PULL) / MAX_PULL;  // 0–1
  const angle = Math.atan2(dy, dx);                   // direction (slingshot-reversed)

  gameState = 'player_shooting';
  shot = createShot(startX, startY, angle, power, 'player');
  setStatus('');
}

// ─── Mouse events ────────────────────────────────────────────────────────────

canvas.addEventListener('mousedown', e => {
  if (gameState === 'gameover') { restartGame(); return; }
  if (gameState !== 'player_aim') return;
  const pos = canvasPos(e);
  if (!nearPlayer(pos)) return;
  drag = { startX: PLAYER.x, startY: PLAYER.y - 50, curX: pos.x, curY: pos.y };
});

canvas.addEventListener('mousemove', e => {
  const pos = canvasPos(e);
  canvas.style.cursor = (gameState === 'player_aim' && nearPlayer(pos)) ? 'grab' : 'crosshair';
  if (!drag) return;
  drag.curX = pos.x;
  drag.curY = pos.y;
  const dist  = Math.hypot(drag.startX - pos.x, drag.startY - pos.y);
  const power = Math.round(Math.min(dist, MAX_PULL) / MAX_PULL * 100);
  setStatus(`Power: ${power}%`);
});

canvas.addEventListener('mouseup', () => { if (drag) launchFromDrag(); });
canvas.addEventListener('mouseleave', () => { drag = null; setStatus('Click and drag your figure to aim'); });

// ─── Touch events ────────────────────────────────────────────────────────────

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState === 'gameover') { restartGame(); return; }
  if (gameState !== 'player_aim') return;
  const pos = canvasPos(e);
  if (!nearPlayer(pos)) return;
  drag = { startX: PLAYER.x, startY: PLAYER.y - 50, curX: pos.x, curY: pos.y };
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!drag) return;
  const pos = canvasPos(e);
  drag.curX = pos.x;
  drag.curY = pos.y;
  const dist  = Math.hypot(drag.startX - pos.x, drag.startY - pos.y);
  const power = Math.round(Math.min(dist, MAX_PULL) / MAX_PULL * 100);
  setStatus(`Power: ${power}%`);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (drag) launchFromDrag();
});

// ─── Aim overlay ─────────────────────────────────────────────────────────────

function drawAim() {
  if (!drag) return;

  const { startX, startY, curX, curY } = drag;
  const rawDx   = startX - curX;
  const rawDy   = startY - curY;
  const rawDist = Math.hypot(rawDx, rawDy);
  if (rawDist < 4) return;

  const clamped = Math.min(rawDist, MAX_PULL);
  const nx      = rawDx / rawDist;
  const ny      = rawDy / rawDist;
  const pullX   = startX - nx * clamped;   // clamped visual anchor
  const pullY   = startY - ny * clamped;
  const power   = clamped / MAX_PULL;      // 0–1

  ctx.save();

  // ── Rubber-band pull line ─────────────────────────────────────────────────
  ctx.strokeStyle = `rgba(200,60,60,${0.3 + power * 0.45})`;
  ctx.lineWidth   = 1.5 + power;
  ctx.setLineDash([5, 4]);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(pullX, pullY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Pull-point circle
  ctx.fillStyle   = `rgba(200,60,60,${0.15 + power * 0.3})`;
  ctx.strokeStyle = `rgba(200,60,60,${0.55 + power * 0.3})`;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(pullX, pullY, 5 + power * 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // ── Straight-line trajectory preview ─────────────────────────────────────
  const angle  = Math.atan2(ny, nx);
  const preLen = SHOT_MAX_LEN;
  const preX2  = startX + Math.cos(angle) * preLen;
  const preY2  = startY + Math.sin(angle) * preLen;

  ctx.strokeStyle = `rgba(42,59,170,${0.10 + power * 0.20})`;
  ctx.lineWidth   = 1.2;
  ctx.setLineDash([4, 9]);
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(preX2, preY2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

// ─── Status bar helper ───────────────────────────────────────────────────────

function setStatus(msg) {
  document.getElementById('status-bar').textContent =
    msg || 'Click and drag your figure to aim';
}

// ─── Notebook background ─────────────────────────────────────────────────────

function drawNotebook() {
  // Paper fill
  ctx.fillStyle = COL.paper;
  ctx.fillRect(0, 0, W, H);

  // Spiral gutter shadow
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0, 0, SPIRAL_W, H);

  // Horizontal ruled lines
  ctx.strokeStyle = COL.lineRule;
  ctx.lineWidth   = 0.8;
  for (let y = 48; y < H; y += LINE_SPACING) {
    ctx.beginPath();
    ctx.moveTo(SPIRAL_W, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Red margin line
  ctx.strokeStyle = COL.margin;
  ctx.lineWidth   = 1.4;
  ctx.beginPath();
  ctx.moveTo(MARGIN_X, 0);
  ctx.lineTo(MARGIN_X, H);
  ctx.stroke();

  // Spiral binding rings
  drawSpiral();

  // Ground / desk surface
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, GROUND_Y + 6, W, H - GROUND_Y - 6);

  // Ground edge line
  ctx.strokeStyle = COL.groundLine;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 6);
  ctx.lineTo(W, GROUND_Y + 6);
  ctx.stroke();
}

function drawSpiral() {
  const ringGap = 18;
  const cx      = 14;   // center x of rings
  const ry      = 9;    // ring height
  const rx      = 8;    // ring width

  ctx.lineWidth = 2;

  for (let y = 36; y < H - 20; y += ringGap) {
    // Back arc (lighter, behind paper)
    ctx.strokeStyle = COL.spiralLight;
    ctx.beginPath();
    ctx.ellipse(cx, y, rx, ry, 0, 0, Math.PI);
    ctx.stroke();

    // Front arc (darker, in front)
    ctx.strokeStyle = COL.spiralDark;
    ctx.beginPath();
    ctx.ellipse(cx, y, rx, ry, 0, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
}

// ─── Stick figure ────────────────────────────────────────────────────────────

function drawFigure(fig, opts = {}) {
  const { x, y }   = fig;
  const col         = opts.colour   || COL.ink;
  const headR       = 13;
  const bodyTop     = y - 44;  // shoulders
  const bodyBot     = y - 2;   // hips
  const headCy      = bodyTop - headR - 2;
  const armY        = bodyTop + 10;
  const armSpread   = 22;
  const legSpread   = 16;
  const legLen      = 30;

  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth   = 2.2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  // Head
  ctx.beginPath();
  ctx.arc(x, headCy, headR, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(x, bodyTop);
  ctx.lineTo(x, bodyBot);
  ctx.stroke();

  // Arms — slight raise on dominant side
  ctx.beginPath();
  ctx.moveTo(x - armSpread, armY + 4);
  ctx.lineTo(x,             armY);
  ctx.lineTo(x + armSpread, armY - 6);
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(x, bodyBot);
  ctx.lineTo(x - legSpread, bodyBot + legLen);
  ctx.moveTo(x, bodyBot);
  ctx.lineTo(x + legSpread, bodyBot + legLen);
  ctx.stroke();

  ctx.restore();
}

// ─── Figure labels ───────────────────────────────────────────────────────────

function drawLabels() {
  ctx.fillStyle = COL.labelText;
  ctx.font      = 'bold 11px Courier New';
  ctx.textAlign = 'center';

  ctx.fillText('YOU', PLAYER.x, PLAYER.y + 50);
  ctx.fillText('CPU', CPU.x,    CPU.y    + 50);

  ctx.textAlign = 'left'; // reset
}

// ─── Main render ─────────────────────────────────────────────────────────────

function drawGameOver() {
  const bw = 300, bh = 120;
  const bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
  ctx.save();
  ctx.fillStyle   = 'rgba(248,244,236,0.94)';
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth   = 2.5;
  ctx.beginPath();
  ctx.rect(bx, by, bw, bh);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle  = COL.ink;
  ctx.font       = 'bold 32px Courier New';
  ctx.textAlign  = 'center';
  ctx.fillText(gameOverMsg, W / 2, by + 52);
  ctx.font       = '14px Courier New';
  ctx.fillStyle  = 'rgba(42,59,170,0.65)';
  ctx.fillText('click / tap to play again', W / 2, by + 88);
  ctx.textAlign  = 'left';
  ctx.restore();
}

function render() {
  drawNotebook();
  drawMarks();

  // Hit flash: briefly draw struck figure in red
  if (hitFlash) {
    hitFlash.timer--;
    if (hitFlash.timer <= 0) hitFlash = null;
  }
  const playerCol = (hitFlash?.who === 'player') ? '#c0392b' : COL.ink;
  const cpuCol    = (hitFlash?.who === 'cpu')    ? '#c0392b' : COL.ink;

  drawFigure(PLAYER, { colour: playerCol });
  drawFigure(CPU,    { colour: cpuCol });
  drawLabels();
  drawAim();
  drawShot();
  if (gameState === 'gameover') drawGameOver();
}

// ─── Game loop ───────────────────────────────────────────────────────────────

function loop() {
  ctx.clearRect(0, 0, W, H);
  stepShot();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
